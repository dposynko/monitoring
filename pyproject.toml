[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "linux-sre-monitor"
version = "0.1.0"
description = "A Linux infrastructure monitoring tool for SRE learning and automation"
requires-python = ">=3.12"
dependencies = [
    "psutil==7.2.2"
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1"
]

[tool.setuptools.packages.find]
where = ["src"]